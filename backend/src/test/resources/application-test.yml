spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seoul_satellite_archive}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    show-sql: true

app:
  cors:
    allowed-origins: http://localhost:3000
  archive:
    root: ${java.io.tmpdir}/ssa-archive-test
  # 테스트는 대기열과 스케줄러를 직접 부른다
  collect:
    worker:
      enabled: false
    scheduler:
      cron: "-"
